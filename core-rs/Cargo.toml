[package]
name = "anamnesix-core"
version = "1.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"

[lib]
name = "anamnesix_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "anamnesix_cli"
path = "src/main.rs"
