name: Build Windows Installer Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute and Increment Release Version
        id: versioning
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $rawTag = $env:GITHUB_REF.Substring(10)
            $ver = $rawTag.TrimStart('v')
            python scripts/bump_version.py --set $ver
            "version=$ver" >> $env:GITHUB_OUTPUT
            "tag=v$ver" >> $env:GITHUB_OUTPUT
          } else {
            $tagVer = python scripts/bump_version.py --next --tag
            $cleanTag = $tagVer.Trim()
            $cleanVer = $cleanTag.TrimStart('v')
            "version=$cleanVer" >> $env:GITHUB_OUTPUT
            "tag=$cleanTag" >> $env:GITHUB_OUTPUT
          }

      - name: Build standalone executable with PyInstaller
        run: |
          python scripts/build_windows.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts/installer.iss

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Anamnesix ${{ steps.versioning.outputs.tag }} - Windows Release"
          body: |
            Anamnesix ${{ steps.versioning.outputs.tag }} - Cartella Clinica Intelligente per Windows
            - Release incrementata automaticamente: `${{ steps.versioning.outputs.tag }}`
            - Installer autonomo completo: `Anamnesix_Setup.exe`
            - Architettura Zero-Knowledge (Argon2id + AES-256-GCM)
            - Gestione multi-profilo familiare con database isolati
            - Pipeline OCR ultraavanzata con pre-processing OpenCV
            - Router AI ibrido (Ollama locale offline + Gemini API cloud con PII Scrubbing)
            - Analisi integrata: Health Score, Radar anomalie, Trend temporali, Correlazioni cliniche
            - Interrogazione conversazionale RAG con citazioni verificate
            - Server MCP integrato (/api/mcp/rpc)
            - Auto-aggiornamento continuo tramite commit GitHub
          draft: false
          prerelease: false
          files: |
            Output/Anamnesix_Setup.exe
            dist/Anamnesix.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
