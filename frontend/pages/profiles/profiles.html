<div class="page-view profiles-view">
  <div class="profiles-header">
    <div>
      <h2 class="section-title">Gestione Profili Familiari</h2>
      <p class="section-subtitle">Ogni membro della famiglia dispone di un database isolato, cartella clinica e file crittografati dedicati.</p>
    </div>
    <button id="btn-open-new-profile" class="btn btn-primary">+ Nuovo Membro della Famiglia</button>
  </div>

  <div class="grid-cols-4" id="profiles-grid"></div>

  <div id="profile-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="profile-modal-title">Aggiungi Membro della Famiglia</h3>
        <button class="modal-close" id="profile-modal-close">✕</button>
      </div>
      <form id="profile-form" class="modal-body">
        <input type="hidden" id="p-id">
        <div class="grid-cols-2">
          <div class="form-group">
            <label for="p-nome">Nome</label>
            <input type="text" id="p-nome" class="input-field" required>
          </div>
          <div class="form-group">
            <label for="p-cognome">Cognome</label>
            <input type="text" id="p-cognome" class="input-field" required>
          </div>
        </div>

        <div class="grid-cols-2">
          <div class="form-group">
            <label for="p-parentela">Grado di Parentela</label>
            <select id="p-parentela" class="input-field" required>
              <option value="Intestatario">Intestatario / Io</option>
              <option value="Coniuge">Coniuge</option>
              <option value="Figlio/a">Figlio/a</option>
              <option value="Padre">Padre</option>
              <option value="Madre">Madre</option>
              <option value="Nonno/a">Nonno/a</option>
              <option value="Fratello/Sorella">Fratello/Sorella</option>
              <option value="Altro">Altro Familiare</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p-data-nascita">Data di Nascita</label>
            <input type="date" id="p-data-nascita" class="input-field" required>
          </div>
        </div>

        <div class="grid-cols-2">
          <div class="form-group">
            <label for="p-sesso">Sesso Biologico</label>
            <select id="p-sesso" class="input-field" required>
              <option value="M">Maschile (M)</option>
              <option value="F">Femminile (F)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p-gruppo">Gruppo Sanguigno</label>
            <select id="p-gruppo" class="input-field">
              <option value="">Non specificato</option>
              <option value="0+">0 Rh Positivo (0+)</option>
              <option value="0-">0 Rh Negativo (0-)</option>
              <option value="A+">A Rh Positivo (A+)</option>
              <option value="A-">A Rh Negativo (A-)</option>
              <option value="B+">B Rh Positivo (B+)</option>
              <option value="B-">B Rh Negativo (B-)</option>
              <option value="AB+">AB Rh Positivo (AB+)</option>
              <option value="AB-">AB Rh Negativo (AB-)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="p-note">Note Anamnestiche e Allergie Familiari</label>
          <textarea id="p-note" class="input-field" rows="3" placeholder="Patologie pregresse, familiarita, intolleranze..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="profile-modal-cancel">Annulla</button>
          <button type="submit" class="btn btn-primary" id="profile-modal-save">Salva Profilo</button>
        </div>
      </form>
    </div>
  </div>
</div>
