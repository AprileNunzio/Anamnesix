<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anamnesix Enterprise - Cockpit Clinico Intelligente</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="components/navbar/navbar.css">
  <link rel="stylesheet" href="components/toast/toast.css">
  <link rel="stylesheet" href="components/family_selector/family_selector.css">
  <link rel="stylesheet" href="components/visualizer_3d/visualizer_3d.css">
  <link rel="stylesheet" href="components/task_tracker/task_tracker.css">
</head>
<body>
  <div id="app-container">
    <aside id="sidebar"></aside>

    <main id="main-content">
      <header id="top-header">
        <h1 id="header-page-title" style="font-size:var(--font-lg); font-weight:700;">Cockpit Clinico</h1>
        <div id="family-selector-mount"></div>
      </header>

      <section id="content-outlet"></section>
    </main>
  </div>

  <div id="toast-mount"></div>
  <div id="task-tracker-mount"></div>

  <script src="js/three.min.js"></script>
  <script src="js/api_client.js"></script>
  <script src="components/toast/toast.js"></script>
  <script src="components/family_selector/family_selector.js"></script>
  <script src="components/navbar/navbar.js"></script>
  <script src="components/visualizer_3d/visualizer_3d.js"></script>
  <script src="components/task_tracker/task_tracker.js"></script>
  <script src="js/router.js"></script>

  <script>
    async function initApplication() {
      const toastRes = await fetch("components/toast/toast.html");
      document.getElementById("toast-mount").innerHTML = await toastRes.text();

      const trackerRes = await fetch("components/task_tracker/task_tracker.html");
      document.getElementById("task-tracker-mount").innerHTML = await trackerRes.text();
      window.taskTracker.init();

      const navRes = await fetch("components/navbar/navbar.html");
      document.getElementById("sidebar").innerHTML = await navRes.text();
      window.initNavbar();

      const famRes = await fetch("components/family_selector/family_selector.html");
      document.getElementById("family-selector-mount").innerHTML = await famRes.text();

      try {
        const status = await window.api.get("/api/auth/status");
        if (status.is_authenticated) {
          await window.initFamilySelector();
          window.router.navigate("dashboard");
        } else {
          window.router.navigate("auth");
        }
      } catch (err) {
        window.router.navigate("auth");
      }
    }
    window.addEventListener("DOMContentLoaded", initApplication);
  </script>
</body>
</html>
