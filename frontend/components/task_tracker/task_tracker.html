<div id="floating-task-tracker" class="task-tracker-dock">
  <div class="task-tracker-header">
    <div class="task-tracker-badge">
      <span class="task-tracker-pulse"></span>
      <span class="task-tracker-title" id="tracker-title">Elaborazione in corso</span>
    </div>
    <button class="task-tracker-close" id="btn-close-tracker">&times;</button>
  </div>
  <div class="task-tracker-body">
    <div class="task-file-name" id="tracker-filename">referto.pdf</div>
    <div class="task-step-desc" id="tracker-step">Avvio pipeline...</div>
    <div class="task-progress-bar">
      <div class="task-progress-fill" id="tracker-fill" style="width: 5%;"></div>
    </div>
    <div class="task-tracker-footer">
      <span id="tracker-percent">5%</span>
      <button class="btn btn-primary btn-sm" id="btn-tracker-action" style="display:none;">Revisiona Ora &rarr;</button>
    </div>
  </div>
</div>
